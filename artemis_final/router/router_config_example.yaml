# Artemis Router Configuration Example
#
# This file provides an example configuration for the Artemis Router module.
# Copy this file and adjust paths and settings for your environment.

router:
  # Path to trained router checkpoint (.pt file)
  checkpoint_path: "/path/to/your/router_checkpoint.pt"

  # Device: "cuda:0", "cuda", "cpu", or "mps" (for Apple Silicon)
  device: "cuda:0"

  # Model names in the order expected by the router
  # This MUST match the order used during training
  model_name_order:
    - "deepseek_ocr"
    - "qwen2_5_vl_3b"
    - "qwen2_5_vl_7b"
    - "qwen3_vl_8b_thinking"
    - "gemma_3_27b"

  # Data type: "float32" or "float16"
  dtype: "float16"

  # Number of CPU threads for inference
  num_threads: 4

  # Run warmup inference on startup
  warmup: true

  # Vision encoder name (must match training)
  vision_encoder_name: "openai/clip-vit-base-patch32"

  # Text encoder name (must match training)
  text_encoder_name: "distilbert-base-uncased"

  # Tokenizer name
  text_tokenizer_name: "distilbert-base-uncased"

  # Freeze vision encoder (should match training)
  freeze_vision: true

  # Freeze text encoder (should match training)
  freeze_text_encoder: false

data:
  # PostgreSQL connection string
  db_url: "postgresql+psycopg2://vlmrouter:vlmrouter@localhost:5432/vlmrouter"

  # Table containing samples for inference
  samples_table: "cauldron_samples"

  # Table for logging router decisions
  logs_table: "router_live_logs"

  # Column names in samples table
  id_column: "sample_id"
  text_column: "prompt_raw"
  image_path_column: "image_path"
  label_column: "router_best_model_name"
  split_column: "split"

  # Root directory for image files
  image_root_dir: "/path/to/images"

  # Optional: path to existing ares config for reference
  ares_config_path: null

features:
  # Maximum text sequence length
  max_text_length: 256

  # Image size (should match CLIP processor)
  image_size: 224

  # Whether to include metadata in text encoding
  use_metadata: true

  # Allow text-only samples (no image)
  allow_text_only: true

  # Allow image-only samples (no text)
  allow_image_only: true

logging:
  # Enable SQL logging
  sql_enabled: true

  # Enable Weights & Biases logging
  wandb_enabled: true

  # W&B project name
  wandb_project: "artemis-router-live"

  # W&B run name
  wandb_run_name: "dev-phase4-router"

  # W&B entity (team/username)
  wandb_entity: null

  # Log full probability distribution to SQL/W&B
  log_router_probs: true

lb:
  # Enable load balancer integration
  enabled: false

  # Protocol: "http" or "kafka"
  protocol: "http"

  # Load balancer endpoint
  endpoint: "http://loadbalancer.internal/route_update"

traffic:
  # Default requests per second for traffic simulation
  default_rps: 5.0

  # Default simulation duration (seconds)
  default_duration_seconds: 60

  # Synthetic image shape [height, width, channels]
  synthetic_image_shape: [224, 224, 3]

  # Synthetic text length (words)
  synthetic_text_length: 32
