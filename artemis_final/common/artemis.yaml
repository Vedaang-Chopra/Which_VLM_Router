data_collection:
  # Table names for collected data (live traffic)
  samples_table: "vlm_samples_collected"
  responses_table: "vlm_responses_collected"
  feedback_table: "vlm_feedback"

retraining:
  # Number of epochs for retraining
  epochs: 1
  # Batch size
  batch_size: 8
  # Output checkpoint path
  output_checkpoint: "checkpoints/best_reward_router_updated.pt"
